<div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon">💰</span>
        <span class="logo-text">ExpenseTracker</span>
      </div>
      <nav class="sidebar-nav">
        <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
          <mat-icon>dashboard</mat-icon>
          <span>Dashboard</span>
        </a>
        <a class="nav-item" routerLink="/expenses" routerLinkActive="active">
          <mat-icon>receipt_long</mat-icon>
          <span>Expenses</span>
        </a>
        <a class="nav-item" routerLink="/expenses/add" routerLinkActive="active">
          <mat-icon>add_circle</mat-icon>
          <span>Add Expense</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <a class="logout-btn" routerLink="/login">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </a>
      </div>
    </aside>
  
    <!-- Main Content -->
    <div class="main-content">
  
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <a routerLink="/expenses" class="back-btn">
            <mat-icon>arrow_back</mat-icon>
          </a>
          <h2 class="page-title">Add Expense</h2>
        </div>
      </header>
  
      <!-- Form Content -->
      <div class="page-content">
        <div class="form-container">
  
          <div *ngIf="errorMessage" class="error-message">
            ⚠️ {{ errorMessage }}
          </div>
  
          <div *ngIf="successMessage" class="success-message">
            ✅ {{ successMessage }}
          </div>
  
          <form #expenseForm="ngForm" (ngSubmit)="onSubmit(expenseForm)">
  
            <!-- Title -->
            <div class="form-group">
              <label class="form-label">Expense Title <span class="required">*</span></label>
              <mat-form-field appearance="outline" class="full-width">
                <input
                  matInput
                  name="title"
                  [(ngModel)]="title"
                  #titleField="ngModel"
                  required
                  placeholder="e.g. Lunch, Bus ticket">
                <mat-error *ngIf="titleField.errors?.['required']">
                  Title is required
                </mat-error>
              </mat-form-field>
            </div>
  
            <!-- Amount -->
            <div class="form-group">
              <label class="form-label">Amount (₹) <span class="required">*</span></label>
              <mat-form-field appearance="outline" class="full-width">
                <input
                  matInput
                  type="number"
                  name="amount"
                  [(ngModel)]="amount"
                  #amountField="ngModel"
                  required
                  min="1"
                  placeholder="Enter amount">
                <mat-error *ngIf="amountField.errors?.['required']">
                  Amount is required
                </mat-error>
              </mat-form-field>
            </div>
  
            <!-- Category -->
            <div class="form-group">
              <label class="form-label">Category <span class="required">*</span></label>
              <mat-form-field appearance="outline" class="full-width">
                <mat-select
                  name="category"
                  [(ngModel)]="category"
                  #categoryField="ngModel"
                  required
                  placeholder="Select category">
                  <mat-option *ngFor="let cat of categories" [value]="cat.value">
                    {{ cat.icon }} {{ cat.value }}
                  </mat-option>
                </mat-select>
                <mat-error *ngIf="categoryField.errors?.['required']">
                  Category is required
                </mat-error>
              </mat-form-field>
            </div>
  
            <!-- Date -->
            <div class="form-group">
              <label class="form-label">Date <span class="required">*</span></label>
              <mat-form-field appearance="outline" class="full-width">
                <input
                  matInput
                  [matDatepicker]="picker"
                  name="date"
                  [(ngModel)]="date"
                  required
                  placeholder="Select date">
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>
            </div>
  
            <!-- Description -->
            <div class="form-group">
              <label class="form-label">Description <span class="optional">(optional)</span></label>
              <mat-form-field appearance="outline" class="full-width">
                <textarea
                  matInput
                  name="description"
                  [(ngModel)]="description"
                  rows="3"
                  placeholder="Add notes about this expense">
                </textarea>
              </mat-form-field>
            </div>
  
            <!-- Buttons -->
            <div class="form-actions">
              <a routerLink="/expenses" class="cancel-btn">
                Cancel
              </a>
              <button
                mat-raised-button
                class="submit-btn"
                type="submit"
                [disabled]="isLoading">
                {{ isLoading ? '⏳ Saving...' : '💾 Save Expense' }}
              </button>
            </div>
  
          </form>
        </div>
      </div>
    </div>
  </div>
